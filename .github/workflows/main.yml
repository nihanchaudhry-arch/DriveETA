name: Build Drive ETA app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o drive-eta-android.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: src/drive-eta-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp src/drive-eta-android/app/build/outputs/apk/debug/app-debug.apk DriveETA.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Drive ETA (build ${{ github.run_number }})
          body: Download DriveETA.apk below and install it on your car screen.
          files: DriveETA.apk
          make_latest: true
